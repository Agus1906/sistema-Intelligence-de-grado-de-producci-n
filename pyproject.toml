[project]
name = "intelligence-system"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["output"]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
